<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Portal BI | Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Ícones -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>
        body {
            height: 100vh;
            background: linear-gradient(135deg, #0a3d78, #002f6c);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            border: none;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
        }

        .login-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-header img {
            max-width: 260px;
            margin-bottom: 15px;
        }

        .form-control {
            height: 48px;
            border-radius: 10px;
        }

        .btn-login {
            height: 48px;
            border-radius: 10px;
            font-weight: 600;
        }

        .footer-text {
            font-size: 0.85rem;
            color: #999;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="card login-card p-4 bg-white">
    <div class="login-header">
        <img src="{{ url_for('static', filename='img/rvi.png') }}"
             alt="Rodovitor Transportes">
        <p class="text-muted mb-0">Portal de Indicadores</p>
    </div>

    <form method="POST">
        <div class="mb-3">
            <label class="form-label fw-semibold">Usuário</label>
            <input type="text" name="username" class="form-control" placeholder="Digite seu usuário" required>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold">Senha</label>
            <input type="password" name="senha" class="form-control" placeholder="Digite sua senha" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 btn-login">
            <i class="fas fa-sign-in-alt me-2"></i> Entrar
        </button>
    </form>

    <div class="footer-text">
        © 2026 • Rodovitor Transportes
    </div>
</div>

</body>
</html>
